name: Build Bhaloo's Reminders

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung Gradle step should die quickly with logs, not sit for six hours.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Run unit tests
        timeout-minutes: 20
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Build installable APK
        timeout-minutes: 20
        run: ./gradlew assembleRelease --no-daemon --stacktrace --console=plain

      - name: Name the APK after Bhaloo
        id: apk
        run: |
          mkdir -p out
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="BhalooReminders-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built $NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BhalooReminders-${{ steps.apk.outputs.version }}-apk
          path: out/*.apk
          if-no-files-found: error

      # The APK filename carries its version, so without this the release would
      # accumulate one file per build and "which one do I download?" would be
      # ambiguous again — the exact trap this release is meant to remove.
      - name: Drop older APKs from the latest release
        if: github.ref_name == 'claude/bhaloo-reminder-android-app-j6tb31'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/releases/tags/latest" \
                  --jq '.assets[].id' 2>/dev/null || true)
          for id in $ids; do
            echo "Removing stale asset $id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done

      # One permanent link that always points at the newest build, so there is
      # never a question of which artifact to download:
      #   https://github.com/Anikiran/Bhaloo-s-reminders/releases/latest
      - name: Publish as the latest download
        if: github.ref_name == 'claude/bhaloo-reminder-android-app-j6tb31'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bhaloo's Reminders — latest
          body: |
            The newest build of Bhaloo's Reminders.

            **Download `${{ steps.apk.outputs.name }}` below** and send it to Bhaloo.

            Version ${{ steps.apk.outputs.version }}, built from `${{ github.sha }}`.
            Installing over an older copy is fine — reminders are kept.
          files: out/*.apk
          # Must NOT be a prerelease: GitHub's /releases/latest endpoint skips
          # prereleases, which would leave that link permanently 404.
          prerelease: false
          make_latest: true

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
