name: Build Bhaloo's Reminders

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung Gradle step should die quickly with logs, not sit for six hours.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Run unit tests
        timeout-minutes: 20
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Build installable APK
        timeout-minutes: 20
        run: ./gradlew assembleRelease --no-daemon --stacktrace --console=plain

      - name: Name the APK after Bhaloo
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/BhalooReminders.apk"

      # Download this, send it to Bhaloo, done.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BhalooReminders-apk
          path: out/BhalooReminders.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
