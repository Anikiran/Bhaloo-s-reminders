name: Build Bhaloo's Reminders

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build installable APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK after Bhaloo
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/BhalooReminders.apk"

      # Download this, send it to Bhaloo, done.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BhalooReminders-apk
          path: out/BhalooReminders.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
